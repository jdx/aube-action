name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  default:
    name: default / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: setup
        uses: $/
      - shell: bash
        env:
          VERSION: ${{ steps.setup.outputs.version }}
          BIN_PATH: ${{ steps.setup.outputs.bin-path }}
          NODE_VERSION: ${{ steps.setup.outputs.node-version }}
        run: |
          aube --version
          test -n "$VERSION"
          test -n "$BIN_PATH"
          test -z "$NODE_VERSION"

  dist:
    name: dist/verify.mjs is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rebuild the verifier bundle
        run: ./verify/build.sh
      - name: Fail if the committed bundle differs
        run: git diff --exit-code -- dist

  verify-rejects:
    name: verification rejects bad downloads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify a real release, then corrupt each input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v2.8.0
          archive="aube-$tag-x86_64-unknown-linux-gnu.tar.gz"
          dir="$RUNNER_TEMP/verify-rejects"
          mkdir -p "$dir"
          gh release download "$tag" --repo aubepkg/aube -D "$dir" \
            -p packslip.sigstore.json -p "$archive"
          verify() { ./scripts/verify-release.sh "$@"; }

          verify "$dir/packslip.sigstore.json" "$dir/$archive" "$archive" "$tag"

          expect_rejected() {
            local what="$1"
            shift
            if "$@" >/dev/null 2>&1; then
              echo "::error::verification accepted $what"
              exit 1
            fi
            echo "rejected $what"
          }

          expect_rejected "the wrong tag" \
            verify "$dir/packslip.sigstore.json" "$dir/$archive" "$archive" v2.7.0

          expect_rejected "an archive the bundle does not list" \
            verify "$dir/packslip.sigstore.json" "$dir/$archive" "not-$archive" "$tag"

          cp "$dir/$archive" "$dir/changed.tar.gz"
          echo x >> "$dir/changed.tar.gz"
          expect_rejected "a modified archive" \
            verify "$dir/packslip.sigstore.json" "$dir/changed.tar.gz" "$archive" "$tag"

          python3 - "$dir/packslip.sigstore.json" "$dir/bad-signature.json" <<'PY'
          import json
          import sys

          bundle = json.load(open(sys.argv[1]))
          sig = bundle["dsseEnvelope"]["signatures"][0]
          sig["sig"] = ("A" if sig["sig"][0] != "A" else "B") + sig["sig"][1:]
          json.dump(bundle, open(sys.argv[2], "w"))
          PY
          expect_rejected "a bundle with a bad signature" \
            verify "$dir/bad-signature.json" "$dir/$archive" "$archive" "$tag"

  pinned:
    name: pinned aube / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: $/
        with:
          version: "1.5.1"
      - shell: bash
        run: |
          aube --version
          aube --version | grep -q '1\.5\.1'

  reuse:
    name: second use skips download / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: first
        uses: $/
        with:
          version: "1.5.1"
      - shell: bash
        env:
          BIN_PATH: ${{ steps.first.outputs.bin-path }}
        run: touch "$BIN_PATH/reuse-marker"
      - id: second
        uses: $/
        with:
          version: "1.5.1"
      - shell: bash
        env:
          BIN_PATH: ${{ steps.first.outputs.bin-path }}
        run: |
          aube --version | grep -q '1\.5\.1'
          test -f "$BIN_PATH/reuse-marker"
          test "${{ steps.second.outputs.bin-path }}" = "$BIN_PATH"

  aube-cache:
    name: aube binary cache restore / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # This job pins a version no other job uses, so a parallel job cannot
      # hold its cache key and make the restore miss.
      - id: first
        uses: $/
        with:
          version: "1.5.0"
      - name: Delete the installed binary
        shell: bash
        env:
          BIN_PATH: ${{ steps.first.outputs.bin-path }}
        run: rm -rf "$BIN_PATH"
      - id: second
        uses: $/
        with:
          version: "1.5.0"
      - shell: bash
        env:
          CACHE_HIT: ${{ steps.second.outputs.aube-cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          aube --version | grep -q '1\.5\.0'

  node-explicit:
    name: node explicit / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: setup
        uses: $/
        with:
          node-version: "22"
      - shell: bash
        env:
          NODE_VERSION: ${{ steps.setup.outputs.node-version }}
          NODE_BIN_PATH: ${{ steps.setup.outputs.node-bin-path }}
        run: |
          node --version | grep -q '^v22\.'
          test -n "$NODE_VERSION"
          test -n "$NODE_BIN_PATH"

  node-auto-mise-toml:
    name: node auto via mise.toml / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - shell: bash
        run: |
          mkdir fixture
          cat > fixture/mise.toml <<'EOF'
          [tools]
          node = "20"
          EOF
      - uses: $/
        with:
          node-version: auto
          working-directory: fixture
      - shell: bash
        run: node --version | grep -q '^v20\.'

  node-auto-nvmrc:
    name: node auto via .nvmrc / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - shell: bash
        run: |
          mkdir fixture
          echo "22" > fixture/.nvmrc
      - uses: $/
        with:
          node-version: auto
          working-directory: fixture
      - shell: bash
        run: node --version | grep -q '^v22\.'

  node-auto-missing-errors:
    name: node auto fails when nothing is pinned
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - shell: bash
        run: mkdir empty
      - id: setup
        continue-on-error: true
        uses: $/
        with:
          node-version: auto
          working-directory: empty
      - shell: bash
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
        run: |
          if [ "$SETUP_OUTCOME" != "failure" ]; then
            echo "expected the action to fail when no node version is pinned"
            exit 1
          fi

  run-install:
    name: run-install / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - shell: bash
        run: |
          mkdir project
          cat > project/package.json <<'EOF'
          {
            "name": "aube-action-test",
            "version": "0.0.0",
            "private": true,
            "dependencies": {
              "is-odd": "3.0.1"
            }
          }
          EOF
          cat > project/aube-lock.yaml <<'EOF'
          lockfileVersion: '9.0'

          settings:
            autoInstallPeers: true
            excludeLinksFromLockfile: false

          time:
            is-number@6.0.0: 2018-03-31T17:02:39.953Z
            is-odd@3.0.1: 2018-05-31T20:04:53.306Z

          importers:

            .:
              dependencies:
                is-odd:
                  specifier: 3.0.1
                  version: 3.0.1

          packages:

            is-number@6.0.0:
              resolution: {integrity: sha512-Wu1VHeILBK8KAWJUAiSZQX94GmOE45Rg6/538fKwiloUu21KncEkYGPqob2oSZ5mUT73vLGrHQjKw3KMPwfDzg==}
              engines: {node: '>=0.10.0'}

            is-odd@3.0.1:
              resolution: {integrity: sha512-CQpnWPrDwmP1+SMHXZhtLtJv90yiyVfluGsX5iNCVkrhQtU3TQHsUWPG9wkdk9Lgd5yNpAg9jQEo90CBaXgWMA==}
              engines: {node: '>=4'}

          snapshots:

            is-number@6.0.0: {}

            is-odd@3.0.1:
              dependencies:
                is-number: 6.0.0
          EOF
      - uses: $/
        with:
          node-version: "22"
          working-directory: project
          run-install: true
      - shell: bash
        working-directory: project
        run: |
          test -d node_modules
          test -f node_modules/is-odd/package.json
          node -e 'process.exit(require("is-odd")(3) ? 0 : 1)'

  cache:
    name: cache / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - shell: bash
        run: |
          mkdir project
          cat > project/package.json <<'EOF'
          {
            "name": "aube-action-test",
            "version": "0.0.0",
            "private": true,
            "dependencies": {
              "is-odd": "3.0.1"
            }
          }
          EOF
          cat > project/aube-lock.yaml <<'EOF'
          lockfileVersion: '9.0'

          settings:
            autoInstallPeers: true
            excludeLinksFromLockfile: false

          time:
            is-number@6.0.0: 2018-03-31T17:02:39.953Z
            is-odd@3.0.1: 2018-05-31T20:04:53.306Z

          importers:

            .:
              dependencies:
                is-odd:
                  specifier: 3.0.1
                  version: 3.0.1

          packages:

            is-number@6.0.0:
              resolution: {integrity: sha512-Wu1VHeILBK8KAWJUAiSZQX94GmOE45Rg6/538fKwiloUu21KncEkYGPqob2oSZ5mUT73vLGrHQjKw3KMPwfDzg==}
              engines: {node: '>=0.10.0'}

            is-odd@3.0.1:
              resolution: {integrity: sha512-CQpnWPrDwmP1+SMHXZhtLtJv90yiyVfluGsX5iNCVkrhQtU3TQHsUWPG9wkdk9Lgd5yNpAg9jQEo90CBaXgWMA==}
              engines: {node: '>=4'}

          snapshots:

            is-number@6.0.0: {}

            is-odd@3.0.1:
              dependencies:
                is-number: 6.0.0
          EOF
      # .npmrc is part of the cache key; a per-run comment keeps reruns
      # and other runs from hitting an earlier cache entry.
      - shell: bash
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: echo "# aube-action test $RUN_ID" > project/.npmrc
      - id: first
        uses: $/
        with:
          node-version: "22"
          working-directory: project
          run-install: true
          cache: true
      - shell: bash
        working-directory: project
        env:
          CACHE_HIT: ${{ steps.first.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" != "true"
          node -e 'process.exit(require("is-odd")(3) ? 0 : 1)'
          rm -rf node_modules
      - id: second
        uses: $/
        with:
          node-version: "22"
          working-directory: project
          run-install: true
          cache: true
      - shell: bash
        working-directory: project
        env:
          CACHE_HIT: ${{ steps.second.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = "true"
          node -e 'process.exit(require("is-odd")(3) ? 0 : 1)'

  cache-requires-run-install:
    name: cache fails without run-install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: setup
        continue-on-error: true
        uses: $/
        with:
          node-version: "22"
          cache: true
      - shell: bash
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
        run: |
          if [ "$SETUP_OUTCOME" != "failure" ]; then
            echo "expected the action to fail when cache is set without run-install"
            exit 1
          fi

  hk:
    name: hk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      # online jactionlint checks (impostor commits, known-vulnerable actions, ...) run in CI only
      - run: mise x hk -- hk check --all
        env:
          JACTIONLINT_ONLINE: 1
          GITHUB_TOKEN: ${{ github.token }}

  # Single-name gate: aggregates every matrix combination above into one
  # required status check. If any upstream job failed, was cancelled, or
  # was skipped, this step exits non-zero so the PR is blocked. Lets the
  # branch-protection rule depend on one name instead of N.
  final:
    needs:
      - hk
      - default
      - dist
      - verify-rejects
      - pinned
      - reuse
      - aube-cache
      - node-explicit
      - node-auto-mise-toml
      - node-auto-nvmrc
      - node-auto-missing-errors
      - run-install
      - cache
      - cache-requires-run-install
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    steps:
      - name: Gate on upstream job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = False
          for name, data in sorted(needs.items()):
              result = data.get("result", "unknown")
              if result == "success":
                  print(f"::notice::{name}: {result}")
              else:
                  print(f"::error::{name}: {result}")
                  failed = True

          if failed:
              print("One or more upstream jobs did not complete successfully.")
              sys.exit(1)

          print("All CI jobs completed successfully.")
          PY

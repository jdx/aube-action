name: release-plz

# On every push to main, scripts/release-plz.sh uses git-cliff to compute the
# next version from conventional commits and opens (or refreshes) a
# "chore: release vX.Y.Z" PR from the `release` branch with a regenerated
# CHANGELOG.md. Merging that PR triggers release.yml.
#
# Runs as a PAT (`RELEASE_PLZ_GITHUB_TOKEN`) because GITHUB_TOKEN-opened PRs
# don't trigger downstream workflows, so test.yml wouldn't run on the release
# PR.

permissions:
  pull-requests: write
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-plz

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_GITHUB_TOKEN }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run release-plz
        env:
          DRY_RUN: 0
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_GITHUB_TOKEN }}
